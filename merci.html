<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Message envoyé - St Mars Informatique</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b1d2b;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  text-align:center;
}

.box{
  background:rgba(0,0,0,0.7);
  padding:60px;        /* PLUS GROS */
  border-radius:15px;
  max-width:700px;     /* PLUS LARGE */
}
h1{
  font-size: 32px;
}

p{
  font-size: 20px;
  line-height: 1.6;
}


h1{
  color:#4da3ff;
}

a{
  display:inline-block;
  margin-top:20px;
  color:white;
  background:#0b5ed7;
  padding:10px 20px;
  border-radius:8px;
  text-decoration:none;
}

/* ===== Correction affichage mobile ===== */
@media (max-width: 600px) {
  .box {
    width: 90%;
    max-width: none;
    padding: 25px;
  }

  h1 {
  color: #4da3ff;
  font-size: 44px; /* AVANT ~22px */
}


 p {
  font-size: 28px;
  line-height: 1.4;
}


 a {
  display: inline-block;
  margin-top: 30px;
  font-size: 26px;
  color: white;
  background: #0b5ed7;
  padding: 18px 36px;
  border-radius: 12px;
  text-decoration: none;
}

}
  
</style>
</head>

<body>

<div class="box">

<h1>✅ Message envoyé</h1>

<p>
Merci pour votre message.<br>
Je vous recontacterai rapidement.
</p>

<a href="index.html">Retour au site</a>

</div>

</body>
</html>
